name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web files
        run: mkdir www && cp index.html www/
      - name: Create Android project
        run: npm init -y && npm i @capacitor/core @capacitor/cli @capacitor/android && npx cap init NEXUS com.nexus.app --web-dir=www && npx cap add android && npx cap sync android
      - na
